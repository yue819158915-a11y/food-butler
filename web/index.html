<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>美食小助手 · 广州觅食地图</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">🍜</span>
    <div>
      <h1>美食小助手</h1>
      <p id="subTitle">广州觅食地图 · 111 家亲测好店</p>
    </div>
  </div>
  <div class="topbar-right">
    <span id="llmBadge" class="badge">AI 状态检查中…</span>
    <button id="btnSettings" class="icon-btn" title="设置">⚙️</button>
  </div>
  <button id="wxHint" class="wx-hint" type="button" hidden>
    <span class="wx-text">🌤 加载今日推荐…</span>
  </button>
</header>

<main class="layout">
  <!-- 左：聊天区 -->
  <section class="chat-panel">
    <div id="chatFlow" class="chat-flow">
      <div class="msg bot">
        <div class="bubble">
          你好！我是美食小助手 🍜 收录了 <b id="totalHint">111</b> 家亲测好吃的广州好店。<br>
          想吃什么直接告诉我就行，也可以描述人群口味，比如：<br>
          <span class="chip" data-q="晚餐人均 40 以下，适合老人家吃的">晚餐人均 40 以下，适合老人家吃的</span>
          <span class="chip" data-q="宵夜想吃海鲜，便宜实惠的那种">宵夜想吃海鲜，便宜实惠的那种</span>
          <span class="chip" data-q="顺德菜，人均 150 左右">顺德菜，人均 150 左右</span>
        </div>
      </div>
    </div>
    <div class="chat-input-wrap">
      <input id="chatInput" type="text" placeholder="告诉我你想吃什么…（口语描述、人群口味都可以）" autocomplete="off">
      <button id="btnSend">发送</button>
    </div>
  </section>

  <!-- 右：推荐结果 -->
  <aside class="result-panel">
    <h2>🍽 推荐结果</h2>
    <div id="resultCount" class="result-count" aria-live="polite"></div>
    <div id="resultList" class="result-list"></div>
    <p class="data-note">菜谱来源：像老乡鸡那样做饭（CookLikeHOC），已结构化改写；营养为估算值，非医学建议。</p>
  </aside>
</main>

<!-- 设置弹窗 -->
<div id="settingsModal" class="modal hidden">
  <div class="modal-card">
    <h3>⚙️ AI 设置</h3>
    <p id="serverKeyStatus" class="muted"></p>
    <label>自定义 LLM Key（存于浏览器，不落盘，优先于服务端 Key）
      <input id="keyInput" type="password" placeholder="粘贴智谱 API Key（可留空）">
    </label>
    <div class="modal-actions">
      <button id="btnSaveKey" class="primary">保存</button>
      <button id="btnClearKey" class="ghost">清除本地 Key</button>
      <button id="btnCloseModal" class="ghost">关闭</button>
    </div>
    <p class="muted small">无 Key 时自动切换本地粤语词库模式，功能照常可用。</p>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
